baseURL: https://oschvr.com/
languageCode: en-us
title: oschvr
theme: PaperMod
pagination:
  pagerSize: 5
permalinks:
  posts: "/:year/:month/:day/:slug/"
  fails: "/:year/:month/:day/:slug/"
  problems: problems/:slug
ignoreLogs:
  - "warning-goldmark-raw-html"
outputs:
  home:
    - html
    - rss
    - json
services:
  disqus:
    shortname: oschvr-1
params:
  homeInfoParams:
    enabled: true
    title: "Hey, I'm Oscar!"
    subtitle: "Senior SRE/DevOps/Infra engineer. Problem solver."
    timelineTitle: "me so far"
    timeline:
      - years: "1990 - 2009"
        label: "Hello world:"
        description: "Born in Mexico. Grew up happy, pulling apart PCs, chasing early internet forums and playing videogames."
      - years: "2010 - 2014"
        label: "Student → Intern"
        description: "Got the intro and got into computers-ish. So I can make a career out of this, eh?. Small stuff but I'm super curious."
      - years: "2014 - 2019"
        label: "Sysadmin → DevOps"
        description: "Got slightly more serious. First jobs developing software and managing servers. For small to medium projects. Don't break prod, got it."
      - years: "2019 - now"
        label: "Senior SRE/DevOps/Infra"
        description: "Got very serious. Got deep into cloud native, cybersecurity and a bit of management. Managed to touch millions of lives with my work."
    also: "family man, foodie, traveler, ocassional runner, perpetual tinkerer"
  socialIcons:
    - name: linkedin
      url: https://www.linkedin.com/in/oschvr/
    - name: github
      url: https://github.com/oschvr
    - name: mastodon
      url: https://mastodon.online/deck/@oschvr
    - name: cv
      url: /cv/os.pdf
  mainSections:
    - posts
  contentTypeName: posts
  themeColor: green
  showMenuItems: 8
  showLanguageSelector: false
  fullWidthTheme: false
  centerTheme: true
  autoCover: true
  showLastUpdated: false
  readingTime: true
  languageName: English
  title: oschvr.com
  description: a blog about software, cloud, security, money, business, travelling and life.
  owner: oschvr
  author: oschvr
  ShowReadingTime: true
  ShowShareButtons: false
  ShowCodeCopyButtons: true
  ShowToc: true
  TocSide: right
  ShowBreadCrumbs: true
  ShowPostNavLinks: true
  comments: true
  keywords:
    - software
    - cloud
    - technology
    - security
    - money
    - business
  menuMore: social
  readMore: read more
  readOther: "read other "
  newer: "newer "
  older: "older "
  missingContentMessage: page not found...
  missingBackButtonLabel: back to home page
  logo:
    logoHomeLink: /

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "tags", "summary", "content"]

menu:
  main:
    - identifier: search
      name: search
      url: /search
      weight: 1

    - identifier: posts
      name: posts
      url: /
      weight: 2

    # - identifier: instant-infra
    #   name: instant-infra
    #   url: /instant-infra
    #   weight: 3

    - identifier: about
      name: about
      url: /about
      weight: 4

    - identifier: snippets
      name: snippets
      url: /snippets
      weight: 5

    - identifier: uses
      name: uses
      url: /uses
      weight: 6

    - identifier: problems
      name: problems
      url: /problems
      weight: 7

    - identifier: fails
      name: fails
      url: /fails
      weight: 8
